# Aplicar en el namespace elegido. Crear previamente el Secret panel-simulador-config
# con las claves PANEL_PASSWORD, PANEL_SESSION_SECRET y profiles.json (ver README).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: panel-simulador-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-simulador
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: panel-simulador
  template:
    metadata:
      labels:
        app: panel-simulador
    spec:
      serviceAccountName: panel-simulador
      securityContext:
        runAsNonRoot: true
      containers:
        - name: panel
          image: ghcr.io/ingbryan/panel-simulador:latest
          ports:
            - containerPort: 3100
          env:
            - name: PANEL_PASSWORD
              valueFrom:
                secretKeyRef: {name: panel-simulador-config, key: PANEL_PASSWORD}
            - name: PANEL_SESSION_SECRET
              valueFrom:
                secretKeyRef: {name: panel-simulador-config, key: PANEL_SESSION_SECRET}
            - name: PANEL_CONFIG_FILE
              value: /app/config/profiles.json
            - name: PANEL_STATE_DIR
              value: /app/data
            - name: PANEL_COOKIE_SECURE
              value: "true"
          volumeMounts:
            - {name: config, mountPath: /app/config, readOnly: true}
            - {name: state, mountPath: /app/data}
          readinessProbe:
            httpGet: {path: /api/health, port: 3100}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 3100}
            initialDelaySeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: config
          secret:
            secretName: panel-simulador-config
            items:
              - {key: profiles.json, path: profiles.json}
        - name: state
          persistentVolumeClaim: {claimName: panel-simulador-state}
---
apiVersion: v1
kind: Service
metadata:
  name: panel-simulador
spec:
  selector: {app: panel-simulador}
  ports:
    - {name: http, port: 3100, targetPort: 3100}
