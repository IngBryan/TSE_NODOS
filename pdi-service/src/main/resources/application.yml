spring:
  application:
    name: pdi-service
  datasource:
    # H2 en memoria: los datos se pierden al reiniciar (Flyway vuelve a crear esquema y personas de prueba)
    url: ${PDI_DB_URL:jdbc:h2:mem:pdi;DB_CLOSE_DELAY=-1}
    username: ${PDI_DB_USER:sa}
    password: ${PDI_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # el esquema lo maneja Flyway
  webservices:
    path: /ws
    servlet:
      init:
        transformWsdlLocations: true   # el soap:address del WSDL usa el host con el que se lo pide

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ${PDI_LOG_FORMAT:ecs}   # logs JSON; incluyen el correlationId del MDC

pdi:
  admin:
    usuario: ${PDI_ADMIN_USER:admin}
    password: ${PDI_ADMIN_PASSWORD:}
  organismo-inicial:
    codigo: ${PDI_ORGANISMO_CODIGO:}
    nombre: ${PDI_ORGANISMO_NOMBRE:MTOP - carga.uy}
    clave: ${PDI_ORGANISMO_CLAVE:}
  simulacion:
    modo: ${PDI_SIMULACION_MODO:NORMAL}
    latencia-ms: ${PDI_SIMULACION_LATENCIA_MS:0}
